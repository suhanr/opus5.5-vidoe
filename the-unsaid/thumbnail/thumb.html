<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:H;src:url(../assets/fonts/Sangbadpatra.ttf)}
@font-face{font-family:B;src:url(../assets/fonts/Tatsama.ttf)}
@font-face{font-family:Fr;src:url(../assets/fonts/Fraunces.ttf);font-weight:100 900}
body{margin:0;background:#000}
.t{width:1080px;height:1350px;position:relative;overflow:hidden;color:#F2EBDD;font-family:H}
.abs{position:absolute}
.brand{position:absolute;left:52px;top:46px;display:flex;align-items:center;gap:14px;font:italic 500 40px Fr;z-index:9;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.brand i{width:13px;height:13px;border-radius:50%;background:#E8A33D;box-shadow:0 0 18px #E8A33D}
.grain{position:absolute;inset:0;opacity:.08;mix-blend-mode:overlay;z-index:8}
.vig{position:absolute;inset:0;background:radial-gradient(closest-side at 50% 50%,transparent 60%,rgba(0,0,0,.65))}
.am{color:#FFBE55}.te{color:#8FF0DF}.ru{color:#E5603F}
.stroke{color:#FFF8EC;text-shadow:0 5px 0 #05070B,0 0 36px rgba(0,0,0,.9)}
svg{overflow:visible}
</style></head><body>

<!-- A: split duty vs pride -->
<div class="t" id="A" style="background:#0C1018">
  <div class="abs" style="left:0;top:0;width:540px;height:1350px;background:linear-gradient(180deg,#123A36 0%,#0C1F22 60%,#081014 100%)"></div>
  <div class="abs" style="left:540px;top:0;width:540px;height:1350px;background:linear-gradient(180deg,#4A3112 0%,#2A1C0E 60%,#120C06 100%)"></div>
  <div class="abs" style="left:540px;top:0;width:540px;height:1350px;background:radial-gradient(60% 40% at 50% 60%,rgba(242,176,74,.35),transparent 70%)"></div>
  <svg class="abs" width="540" height="1350" style="left:540px;top:0;opacity:.35"><path d="M110 1200 V700 H430 V1200 M110 870 H430 M110 1035 H430 M70 710 L270 540 L470 710" fill="none" stroke="#F2B04A" stroke-width="8"/></svg>
  <svg id="apaA" class="abs" viewBox="0 0 400 760" width="560" height="1064" style="left:-10px;top:330px"></svg>
  <svg id="sonA" class="abs" viewBox="0 0 400 760" width="560" height="1064" style="left:530px;top:330px"></svg>
  <div class="abs" style="left:0;right:0;bottom:0;height:520px;background:linear-gradient(0deg,rgba(6,8,12,.97) 35%,transparent)"></div><div class="vig"></div>
  <div class="abs" style="left:536px;top:0;width:8px;height:1350px;background:#E5603F;box-shadow:0 0 30px #E5603F"></div>
  <div class="abs stroke" style="left:0;width:540px;top:200px;text-align:center;font-size:120px" ><span class="te" style="text-shadow:0 5px 0 #05070B,0 0 40px rgba(127,208,194,.7)">ঘাম</span></div>
  <div class="abs stroke" style="left:540px;width:540px;top:200px;text-align:center;font-size:120px"><span class="am" style="text-shadow:0 5px 0 #05070B,0 0 40px rgba(242,176,74,.7)">টাকা</span></div>
  <div class="abs" style="left:440px;top:200px;width:200px;height:200px;border-radius:50%;background:#E5603F;display:flex;align-items:center;justify-content:center;font:900 150px/1 sans-serif;color:#0A0D14;box-shadow:0 0 50px rgba(229,96,63,.8);top:330px">≠</div>
  <div class="abs" style="left:0;right:0;bottom:250px;text-align:center;font-family:B;font-size:52px;color:#C9CDD6">বাবা-মা নাকি সব সন্তানরে সমান ভালোবাসে?</div>
  <div class="abs stroke" style="left:0;right:0;bottom:80px;text-align:center;font-size:150px;line-height:1">সবচেয়ে <span class="ru" style="text-shadow:0 5px 0 #05070B,0 0 50px rgba(229,96,63,.7)">ভদ্র মিথ্যা</span></div>
  <div class="grain"></div><div class="brand"><i></i>The Unsaid</div>
</div>

<!-- B: Apa's eyes close-up -->
<div class="t" id="B" style="background:#0B0E15">
  <svg id="apaB" class="abs" viewBox="0 0 400 760" width="1600" height="3040" style="left:-260px;top:-150px"></svg>
  <div class="abs" style="inset:0;background:linear-gradient(0deg,rgba(6,8,12,1) 30%,rgba(6,8,12,.2) 62%,rgba(6,8,12,.35) 100%)"></div><div class="vig"></div>
  <div class="abs" style="left:70px;top:140px;padding:14px 30px 22px;background:#E5603F;color:#0A0D14;font-size:56px;transform:rotate(-3deg);box-shadow:0 10px 40px rgba(0,0,0,.6)">বাড়ি গেল ছেলের নামে</div>
  <div class="abs" style="left:0;right:0;top:810px;text-align:center;font-family:B;font-size:50px;color:#C9CDD6">৪ বছর বাবার সেবা করল যে মেয়ে, সে পাইল—</div>
  <div class="abs" style="left:150px;right:150px;top:900px;border:6px solid #7FD0C2;border-radius:26px;background:rgba(14,26,30,.9);padding:22px 40px 30px;box-shadow:0 0 50px rgba(127,208,194,.3)">
    <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:70px"><span class="B" style="font-family:B;color:#C9CDD6;font-size:54px">ধন্যবাদ:</span><span class="ru" style="font-size:130px;line-height:1;text-shadow:0 0 40px rgba(229,96,63,.7)">০</span></div></div>
  <div class="abs stroke" style="left:0;right:0;bottom:60px;text-align:center;font-size:118px">সবচেয়ে <span class="ru">ভদ্র মিথ্যা</span></div>
  <div class="grain"></div><div class="brand"><i></i>The Unsaid</div>
</div>
<script src="../web/characters.js"></script>
<script>
const K=CHAR;
document.getElementById('apaA').innerHTML=K.apa('tired','bowl');
document.getElementById('sonA').innerHTML=K.son('smile','phone').replace('<g id="head"','<g id="head" style="transform-box:fill-box;transform-origin:50% 100%;transform:rotate(-4deg)"');
document.getElementById('apaB').innerHTML=K.apa('hollow','idle');
// grain
const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d'),d=g.createImageData(256,256);
for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}
g.putImageData(d,0,0);document.querySelectorAll('.grain').forEach(e=>e.style.backgroundImage=`url(${c.toDataURL()})`);
</script></body></html>
