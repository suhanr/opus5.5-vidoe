<!doctype html>
<html><head><meta charset="utf-8"><title>The Unsaid</title>
<style>
@font-face{font-family:H;src:url(../assets/fonts/Sangbadpatra.ttf)}
@font-face{font-family:B;src:url(../assets/fonts/Tatsama.ttf)}
@font-face{font-family:Q;src:url(../assets/fonts/Nakkhatra.ttf)}
@font-face{font-family:Fr;src:url(../assets/fonts/Fraunces.ttf);font-weight:100 900}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1350px;overflow:hidden;background:#0F1420;color:#F2EBDD;font-family:B}
#bg,#fx,#grain,#vig,#brand,#layers{position:absolute;inset:0}
#layers>.layer{position:absolute;inset:0;transform-origin:50% 50%}
.abs{position:absolute}
.blk{position:absolute;left:0;right:0;text-align:center;padding:0 70px}
.H{font-family:H;line-height:1.15}.B{font-family:B;line-height:1.3}.Q{font-family:Q;line-height:1.35}
.w{display:inline-block;white-space:pre;will-change:transform}
.am{color:#E8A33D}.te{color:#6FB8AC}.ru{color:#D2583D}.dm{color:#8D93A3}.pa{color:#F2EBDD}
.glowA{text-shadow:0 0 30px rgba(232,163,61,.55)}.glowT{text-shadow:0 0 30px rgba(111,184,172,.5)}.glowR{text-shadow:0 0 34px rgba(210,88,61,.6)}
svg{overflow:visible}
#grain{opacity:.075;mix-blend-mode:overlay;pointer-events:none}
#vig{background:radial-gradient(closest-side at 50% 48%,transparent 62%,rgba(0,0,0,.62));pointer-events:none}
#brand{pointer-events:none}
.warm{position:absolute;opacity:0}
</style></head>
<body><div id="stage"><canvas id="bg" width="1080" height="1350"></canvas><div id="layers"></div><canvas id="fx" width="1080" height="1350"></canvas><div id="grain"></div><div id="vig"></div><div id="brand"></div></div>
<span class="warm" style="font-family:H">ক</span><span class="warm" style="font-family:B">ক</span><span class="warm" style="font-family:Q">ক</span><span class="warm" style="font-family:Fr">a</span>
<script src="timeline.js"></script><script src="characters.js"></script><script src="engine.js"></script><script src="scenes.js"></script>
</body></html>
