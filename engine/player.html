<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Shorts Engine</title>
<style>
  @font-face { font-family: "Fraunces"; src: url("../assets/fonts/Fraunces.ttf"); font-weight: 100 900; }
  @font-face { font-family: "Caveat"; src: url("../assets/fonts/Caveat.ttf"); font-weight: 400 700; }
  @font-face { font-family: "InterX"; src: url("../assets/fonts/Inter-ExtraBold.otf"); font-weight: 800; }
  @font-face { font-family: "InterS"; src: url("../assets/fonts/Inter-SemiBold.otf"); font-weight: 600; }
  @font-face { font-family: "Anton"; src: url("../assets/fonts/Anton-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "Bebas"; src: url("../assets/fonts/BebasNeue-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "Mono"; src: url("../assets/fonts/JetBrainsMono.ttf"); font-weight: 100 800; }
  @font-face { font-family: "Playfair"; src: url("../assets/fonts/PlayfairDisplay.ttf"); font-weight: 400 900; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
  // ?ep=episodes/<slug>  — load timeline, engine, then the episode's scenes, in order
  const ep = new URLSearchParams(location.search).get('ep');
  const files = [`../${ep}/out/timeline.js`, 'lib.js', `../${ep}/scenes.js`];
  (function next(i) {
    if (i >= files.length) return;
    const s = document.createElement('script'); s.src = files[i]; s.onload = () => next(i + 1);
    s.onerror = () => { document.title = 'LOAD ERROR ' + files[i]; };
    document.body.appendChild(s);
  })(0);
</script>
</body>
</html>
