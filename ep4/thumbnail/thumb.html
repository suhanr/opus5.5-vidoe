<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:H;src:url(../assets/fonts/Shishir.ttf)}
@font-face{font-family:B;src:url(../assets/fonts/Nilabhro.ttf)}
@font-face{font-family:N;src:url(../assets/fonts/Himadri.ttf)}
@font-face{font-family:Fr;src:url(../assets/fonts/Fraunces.ttf);font-weight:100 900}
body{margin:0;background:#000}
.t{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:H;color:#141414}
.abs{position:absolute}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.12) 7px,transparent 8px);background-size:34px 34px;-webkit-mask-image:radial-gradient(circle at 100% 100%,#000 0%,transparent 75%)}
.stk{color:#fff;-webkit-text-stroke:14px #141414;paint-order:stroke fill;text-shadow:9px 10px 0 #141414}
.stkY{color:#FFD23F;-webkit-text-stroke:14px #141414;paint-order:stroke fill;text-shadow:9px 10px 0 #141414}
.stkR{color:#FF4B3E;-webkit-text-stroke:14px #141414;paint-order:stroke fill;text-shadow:9px 10px 0 #141414}
.brand{position:absolute;left:46px;top:42px;display:flex;align-items:center;gap:12px;padding:8px 22px 10px;background:#141414;border-radius:40px;transform:rotate(-2deg);z-index:9}
.brand i{width:12px;height:12px;border-radius:50%;background:#FFD23F}.brand span{font:italic 600 32px Fr;color:#fff}
svg{overflow:visible}
</style></head><body>

<!-- A: muted father -->
<div class="t" id="A" style="background:#FFD23F">
  <div class="dots"></div>
  <div class="abs" style="left:640px;top:240px;width:620px;height:620px;border-radius:50%;background:#FF4B3E"></div>
  <svg id="abbaA" class="abs" viewBox="0 0 400 760" width="1000" height="1900" style="left:330px;top:230px;filter:drop-shadow(8px 0 0 #fff) drop-shadow(-8px 0 0 #fff) drop-shadow(0 8px 0 #fff) drop-shadow(0 -8px 0 #fff) drop-shadow(16px 18px 0 rgba(0,0,0,.25))"></svg>
  <svg class="abs" width="560" height="210" viewBox="0 0 380 140" style="left:60px;top:150px;transform:rotate(-5deg)"><rect x="0" y="0" width="380" height="140" rx="26" fill="#fff" stroke="#141414" stroke-width="6"/><path d="M10 60 h26 l34 -30 v100 l-34 -30 h-26z" fill="#141414"/><path d="M80 52 l30 36 M110 52 l-30 36" stroke="#FF4B3E" stroke-width="9" stroke-linecap="round"/>
    <g id="barsA"></g></svg>
  <div class="abs stk" style="left:60px;top:420px;width:600px;font-size:104px;line-height:1.12">বাবার গলা<br><span class="stkR">নিচু</span> হইল<br>কবে?</div>
  <div class="abs" style="left:0;right:0;bottom:0;height:250px;background:#141414"></div>
  <div class="abs" style="left:60px;right:60px;bottom:70px;font-family:B;font-size:52px;color:#fff;line-height:1.3">টাকা আসা বন্ধ হইলে বাবা হইয়া যান <span style="background:#FFD23F;color:#141414;padding:0 .15em;border-radius:6px">"অতিথি"</span></div>
  <div class="brand"><i></i><span>The Unsaid</span></div>
</div>

<!-- B: the note and three notes -->
<div class="t" id="B" style="background:#FFE3A8">
  <div class="dots" style="-webkit-mask-image:radial-gradient(circle at 0% 0%,#000 0%,transparent 70%)"></div>
  <div class="abs" style="left:-20px;right:-20px;bottom:0;height:380px;background:#B9773F;border-top:8px solid #141414"></div>
  <div id="notesB"></div>
  <div class="abs" style="left:110px;top:330px;width:860px;background:#FFFDF5;border:6px solid #141414;box-shadow:16px 18px 0 rgba(0,0,0,.22);padding:44px 50px 54px;transform:rotate(-3deg);background-image:repeating-linear-gradient(0deg,transparent 0 71px,rgba(47,91,255,.18) 71px 73px)">
    <div style="font-family:N;font-size:66px;color:#1E2A6E;line-height:1.5">আমার পেনশনের টাকা থেইকা তিন হাজার রাখলাম। ফ্রিজের ডেলিভারি চার্জটা এইখান থেইকা দিস।</div>
    <div class="abs" style="left:360px;top:-28px;width:130px;height:50px;background:rgba(255,210,63,.8);transform:rotate(4deg)"></div></div>
  <div class="abs stk" style="left:0;right:0;top:150px;text-align:center;font-size:92px">বাবার <span class="stkR">চিরকুট</span></div>
  <div class="abs stk" style="left:0;right:0;bottom:80px;text-align:center;font-size:86px">এইটা টাকা <span class="stkY">না</span></div>
  <div class="brand"><i></i><span>The Unsaid</span></div>
</div>
<script src="../web/characters.js"></script><script src="../web/characters2.js"></script>
<script>
document.getElementById('abbaA').innerHTML=CHAR.abba2('tense');
let b='';for(let i=0;i<10;i++){const h=20+i*11;b+=`<rect x="${110+i*26}" y="${130-h}" width="18" height="${h}" rx="4" fill="none" stroke="#141414" stroke-width="4"/>`}document.getElementById('barsA').innerHTML=b;
let n='';for(let i=0;i<3;i++)n+=`<div class="abs" style="left:${150+i*60}px;top:${1010-i*24}px;width:560px;height:250px;background:linear-gradient(135deg,#E9C98A,#D9A95F);border:6px solid #141414;border-radius:14px;transform:rotate(${-8+i*7}deg);box-shadow:8px 10px 0 rgba(0,0,0,.25)"><div class="abs" style="left:24px;top:16px;font:700 64px H">১০০০</div><div class="abs" style="right:24px;bottom:14px;font:700 46px H">টাকা</div><div class="abs" style="left:230px;top:50px;width:150px;height:150px;border-radius:50%;border:5px solid rgba(20,20,20,.35)"></div></div>`;
document.getElementById('notesB').innerHTML=n;
</script></body></html>
